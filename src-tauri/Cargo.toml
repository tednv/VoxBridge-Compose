[package]
name = "voxbridge-compose"
version = "0.3.0"
description = "GPU-first local transcription and composition workspace"
authors = ["VoxBridge Compose contributors"]
license = "AGPL-3.0-only"
repository = "https://github.com/tednv/VoxBridge-Compose"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "^2", features = [] }

[dependencies]
tauri = { version = "^2", features = [ "tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "^2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.13.1", features = ["json", "multipart"] }
futures-util = "0.3"
cpal = "0.17"
hound = "3.5"
dirs = "6.0.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11.8"
chrono = { version = "0.4", features = ["serde"] }
libloading = "0.9.0"
arboard = "3.6.1"
# Local experimental build: VoxBridge still supplies the production Vulkan path.
# Keeping the emergency whisper-rs fallback CPU-only avoids whisper-rs-sys's Windows
# Vulkan shader-generator path failure while testing the Faster Whisper backend.
whisper-rs = "0.16.0"
voxbridge = { path = "../voxbridge" }
tokio-util = { version = "0.7", features = ["io"] }
sha2 = "0.11"
async-trait = "0.1"
x11rb = { version = "0.14.0", features = ["xtest"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
pulsectl-rs = "0.3"
evdev = "0.13.2"
# ashpd is pinned to 0.12.x on purpose. 0.13 is a breaking change for this code twice
# over: the portal modules used here (global_shortcuts, remote_desktop, camera) became
# opt-in cargo features, and `Session<'a, T>` dropped its lifetime parameter. Nothing in
# this app needs 0.13, so it stays on the API the Wayland portal code was written
# against. Do not let an automated dependency bump move this without porting
# src/platform/linux/wayland/ first.
ashpd = { version = "0.12.1", features = ["tokio"] }
zbus = "5.13.1"
nix = "0.31.1"
gtk = "0.18"
gdk = "0.18"
gtk-layer-shell = { version = "0.8.2", features = ["v0_6"] }
arboard = { version = "3.6.1", features = ["wayland-data-control"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_UI_Input_KeyboardAndMouse", 
    "Win32_Foundation", 
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_Properties",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common"
] }

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "voxbridge-compose"
path = "src/main.rs"

# Attempted: route whisper-rs-sys to vendor/whisper-rs-sys (a locally patched copy
# supporting GGML_CPU_ALL_VARIANTS runtime CPU dispatch). Reverted — hit a real
# architectural wall (whisper-rs's Rust bindings call ggml-cpu/ggml-vulkan symbols
# directly, which don't get import libraries under GGML_BACKEND_DL's MODULE-library
# build). Would need whisper-rs itself patched too, not just this crate. Left the vendor
# copy and this commented-out patch in place for a future attempt.
# [patch.crates-io]
# whisper-rs-sys = { path = "vendor/whisper-rs-sys" }
