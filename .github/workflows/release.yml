name: Release

# Builds Windows and Linux binaries from source (including VoxBridge's engine variants,
# built fresh in this same job via its git submodule) and publishes them as a GitHub
# Release with a SHA256SUMS.txt covering every artifact. The point: anyone downloading a
# release can verify the file they got matches what this public, auditable workflow
# actually produced from this tagged commit - not just a claim.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to attach the release to (only used for manual runs, not tag pushes)"
        required: false
        default: "v0.2.0"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" -OutFile VulkanSDK.exe
          $proc = Start-Process -FilePath .\VulkanSDK.exe -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Vulkan SDK installer exited with code $($proc.ExitCode)" }
          $sdkPath = Get-ChildItem "C:\VulkanSDK" -Directory | Select-Object -First 1
          Write-Output "VULKAN_SDK=$($sdkPath.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "$($sdkPath.FullName)\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install npm dependencies
        run: npm ci

      - name: Build
        run: npm run tauri:build
        env:
          CMAKE_GENERATOR: Ninja

      - name: Collect artifacts and checksums
        shell: pwsh
        run: |
          $bundleDir = "C:\voxbridge-compose-build\release\bundle"
          $outDir = "release-assets"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Get-ChildItem -Recurse -Path $bundleDir -Include *.msi,*.exe -ErrorAction Stop |
            ForEach-Object { Copy-Item $_.FullName -Destination $outDir }
          Get-ChildItem $outDir -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -Encoding utf8 "$outDir\SHA256SUMS-windows.txt"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: release-assets/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpulse-dev libgtk-layer-shell-dev cmake pkg-config libclang-dev \
            build-essential libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libvulkan-dev glslc \
            spirv-headers spirv-tools libshaderc-dev vulkan-utility-libraries-dev \
            libasound2-dev libssl-dev libudev-dev ninja-build wl-clipboard \
            fuse patchelf file squashfs-tools appstream desktop-file-utils
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

      - name: Install npm dependencies
        run: npm ci

      - name: Build
        run: npm run tauri:build
        env:
          CMAKE_GENERATOR: Ninja

      - name: Collect artifacts and checksums
        run: |
          mkdir -p release-assets
          find src-tauri/target/release/bundle -type f \
            \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) \
            -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum * > SHA256SUMS-linux.txt

      - uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: release-assets/*

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Combine into one SHA256SUMS.txt
        run: |
          mkdir -p release-assets
          cp artifacts/windows-release/* release-assets/ 2>/dev/null || true
          cp artifacts/linux-release/* release-assets/ 2>/dev/null || true
          cat release-assets/SHA256SUMS-*.txt > release-assets/SHA256SUMS.txt
          rm -f release-assets/SHA256SUMS-windows.txt release-assets/SHA256SUMS-linux.txt
          cat release-assets/SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: release-assets/*
          body_path: .github/release-notes/v0.2.0.md
          fail_on_unmatched_files: true
